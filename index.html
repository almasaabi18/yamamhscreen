    <style>
        
        body, html {
            margin: 0;
            padding: 0;

        }

       
        .fullscreen-video-container {
            position: absolute;
            top: 0;

            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
    </style>
</head>
<body>

    <div class="fullscreen-video-container">
        
        <iframe src="https://player.vimeo.com/video/1224631965?h=6e74d0fed5&background=1&quality=1080p&loop=1&autoplay=1&muted=1"
